name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out ../dist --interpreter python${{matrix.python-version}}
          working-directory: minisearch
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}-py${{ matrix.python-version }}
          path: dist/*.whl
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r .github/workflows/requirements.txt
      - name: Install wheel
        if: matrix.platform.target == 'x86_64'
        run: python .github/workflows/install_wheel.py dist
      - name: Run tests
        if: matrix.platform.target == 'x86_64'
        run: python -m pytest -v tests/test_search.py

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        platform:
          - runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out ../dist --interpreter python${{matrix.python-version}}
          working-directory: minisearch
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}-py${{ matrix.python-version }}
          path: dist/*.whl
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r .github/workflows/requirements.txt
      - name: Install wheel
        run: python .github/workflows/install_wheel.py dist
      - name: Run tests
        run: python -m pytest -v tests/test_search.py

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        platform:
          - runner: macos-latest
            target: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out ../dist --interpreter python${{matrix.python-version}}
          working-directory: minisearch
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}-py${{ matrix.python-version }}
          path: dist/*.whl
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r .github/workflows/requirements.txt
      - name: Install wheel
        run: python .github/workflows/install_wheel.py dist
      - name: Run tests
        run: python -m pytest -v tests/test_search.py
