name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out ../dist --interpreter python${{matrix.python-version}}
          working-directory: minisearch
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}-py${{ matrix.python-version }}
          path: dist/*.whl
      - name: Install test dependencies
        if: matrix.platform.target == 'x86_64'
        run: python -m pip install --upgrade pip && python -m pip install -r .github/workflows/requirements.txt
      - name: Install wheel
        if: matrix.platform.target == 'x86_64'
        run: python .github/workflows/install_wheel.py dist
      - name: Run tests
        if: matrix.platform.target == 'x86_64'
        run: python -m pytest -v tests/test_search.py

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        platform:
          - runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out ../dist --interpreter python${{matrix.python-version}}
          working-directory: minisearch
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}-py${{ matrix.python-version }}
          path: dist/*.whl
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r .github/workflows/requirements.txt
      - name: Install wheel
        run: python .github/workflows/install_wheel.py dist
      - name: Run tests
        run: python -m pytest -v tests/test_search.py

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        platform:
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out ../dist --interpreter python${{matrix.python-version}}
          working-directory: minisearch
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}-py${{ matrix.python-version }}
          path: dist/*.whl
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r .github/workflows/requirements.txt
      - name: Install wheel
        run: python .github/workflows/install_wheel.py dist
      - name: Run tests
        run: python -m pytest -v tests/test_search.py

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out ../dist
          working-directory: minisearch
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
      - name: Debug dist
        run: |
          pwd
          ls -lah
          ls -lah dist || true

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [linux, windows, macos, sdist]
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Debug downloaded artifacts
        run: |
          ls -Rlah artifacts || true
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/**/*.whl
            artifacts/**/*.tar.gz
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing artifacts/**/**/*.whl artifacts/**/**/*.tar.gz
